packages:
  - apps/*
  - packages/*

# Tool versions, pinned once for every package.
catalog:
  "@biomejs/biome": 2.5.14
  "@playwright/test": 1.63.0
  "@types/node": 26.6.3
  typescript: 7.0.2
  vitest: 5.0.2
  wrangler: 4.145.0

minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20260930.2"
  - "@cloudflare/workerd-darwin-arm64@1.20260930.2"
  - "@cloudflare/workerd-linux-64@1.20260930.2"
  - "@cloudflare/workerd-linux-arm64@1.20260930.2"
  - "@cloudflare/workerd-windows-64@1.20260930.2"
  - miniflare@5.20260930.0-alpha
  - workerd@1.20260930.2
  - wrangler@4.145.0

# Dependencies allowed to run install scripts (native binaries).
allowBuilds:
  esbuild: true
  workerd: true
