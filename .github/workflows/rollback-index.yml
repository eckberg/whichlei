name: Roll back index

# By hand only: Actions → Roll back index → Run workflow, with "rollback" typed in.
# Restores the previous version of the whichlei-index Worker. That version holds the build
# before the live one and the one before that, so pages open on either keep working. The
# next scheduled publish builds from GLEIF again and replaces whatever is live.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "rollback" to restore the previous version of the index.
        required: true

permissions:
  contents: read

# The same group as the publish, so the two never run at once.
concurrency:
  group: publish-index
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INDEX_ORIGIN: https://whichlei-index.lumenspring.workers.dev
      CONFIRM: ${{ inputs.confirm }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Confirm
        run: |
          if [ "$CONFIRM" != "rollback" ]; then
            echo "::error::Type rollback in the confirm input to run this workflow."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Live build before
        id: live
        run: |
          build=$(node apps/index/scripts/live-build.ts --origin "$INDEX_ORIGIN")
          if [ -z "$build" ]; then
            echo "::error::There is no live index to roll back."
            exit 1
          fi
          echo "before=$build" >> "$GITHUB_OUTPUT"
          echo "live build before the rollback: $build"

      - name: Roll back
        working-directory: apps/index
        env:
          BEFORE: ${{ steps.live.outputs.before }}
        run: pnpm exec wrangler rollback --yes --message "rollback from $BEFORE"

      - name: Verify the live index
        env:
          BEFORE: ${{ steps.live.outputs.before }}
        run: |
          pnpm --filter @whichlei/index verify-live --origin "$INDEX_ORIGIN" --not-build "$BEFORE" \
            --markdown "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          after=$(node apps/index/scripts/live-build.ts --origin "$INDEX_ORIGIN" || true)
          {
            echo "### Rollback"
            echo
            echo "Live build before: \`${{ steps.live.outputs.before }}\`"
            echo
            echo "Live build now: \`${after:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
