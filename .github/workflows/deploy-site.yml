name: Deploy site

# By hand only: Actions → Deploy site → Run workflow. Deploys apps/web to the
# whichlei-site Worker (workers.dev and whichlei.com), runs the browser tests against the
# workers.dev host, deploys apps/redirect (the whichlei-redirect Worker for www.whichlei.com),
# then runs the live check against whichlei.com.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://whichlei.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The search page reads the index origin at build time (slice 7).
      - run: pnpm --filter @whichlei/web build
        env:
          INDEX_ORIGIN: https://index.whichlei.com
      - id: deploy
        working-directory: apps/web
        # bash with pipefail: wrangler prints the workers.dev URL before it can fail on the
        # custom domain, and `| tee` would hide its exit code.
        shell: bash
        run: |
          pnpm exec wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter @whichlei/web exec playwright install --with-deps chromium
      - run: pnpm --filter @whichlei/web e2e
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
      - name: Deploy the www redirect
        working-directory: apps/redirect
        run: pnpm exec wrangler deploy
      # The apex answers a minute or so after the deploy, and an edge may still serve the old
      # robots.txt (Disallow) for a while. The check starts when it says Allow.
      - name: Wait for whichlei.com to allow indexing
        timeout-minutes: 6
        shell: bash
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 https://whichlei.com/robots.txt | grep -qx 'Allow: /'; then
              echo "whichlei.com/robots.txt allows indexing"
              exit 0
            fi
            echo "attempt $i of 30: whichlei.com/robots.txt does not say 'Allow: /' yet"
            sleep 10
          done
          echo "::error::https://whichlei.com/robots.txt did not say 'Allow: /' within 5 minutes"
          exit 1
      # The live check (docs/specs/11-launch.md): a browser on the apex, Fathom let in but
      # answered by the check itself, so nothing is counted. It fails, and cannot hang: the
      # step and the test both have a limit.
      - name: Live check on whichlei.com
        timeout-minutes: 5
        run: pnpm --filter @whichlei/web e2e live
        env:
          LIVE_URL: https://whichlei.com
