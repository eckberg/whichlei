name: Deploy site

# By hand only: Actions → Deploy site → Run workflow. Deploys apps/web to the
# whichlei-site Worker on workers.dev, then runs the browser tests against it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: workers.dev
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The search page reads the index origin at build time (slice 7).
      - run: pnpm --filter @whichlei/web build
        env:
          INDEX_ORIGIN: https://whichlei-index.lumenspring.workers.dev
      - id: deploy
        working-directory: apps/web
        run: |
          pnpm exec wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - run: pnpm --filter @whichlei/web exec playwright install --with-deps chromium
      - run: pnpm --filter @whichlei/web e2e
        env:
          BASE_URL: ${{ steps.deploy.outputs.url }}
